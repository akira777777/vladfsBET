name: VladfsBET CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vladfsbet
          POSTGRES_PASSWORD: vladfspassword
          POSTGRES_DB: vladfsbet_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://vladfsbet:vladfspassword@localhost:5432/vladfsbet_db

      - name: Run Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://vladfsbet:vladfspassword@localhost:5432/vladfsbet_db
          NODE_ENV: production
